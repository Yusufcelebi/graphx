<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matematiksel Grafik & Fonksiyon Analiz Laboratuvarı</title>
  <!-- Math.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.all.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-layout">
    <!-- Sol Panel -->
    <aside class="sidebar">
      <div class="brand">
        <h2>Graph<span>Studio</span></h2>
      </div>

      <div class="control-group">
        <label for="func-input">Fonksiyon $f(x)$:</label>
        <div class="input-row">
          <input type="text" id="func-input" value="x^3 - 3*x" placeholder="Örn: x^2 - 4" />
        </div>
      </div>

      <!-- Analiz Butonu -->
      <button id="analyze-btn" class="btn btn-accent">🔍 Fonksiyonu Analiz Et</button>

      <!-- Analiz Sonuç Kutusu -->
      <div id="analysis-panel" class="analysis-panel hidden">
        <h3>📊 Fonksiyon Raporu</h3>
        <div class="analysis-content" id="analysis-content">
          <!-- JS ile doldurulacak -->
        </div>
      </div>

      <div class="toggles">
        <label class="checkbox-label">
          <input type="checkbox" id="show-derivative" />
          <span>Türevini Göster ($f'(x)$)</span>
        </label>
      </div>

      <div class="control-group slider-box">
        <div class="slider-header">
          <label for="param-a">Parametre $a$ = <span id="param-val">1.0</span></label>
          <button id="animate-btn" class="icon-btn">▶ Oynat</button>
        </div>
        <input type="range" id="param-a" min="-5" max="5" step="0.1" value="1" />
      </div>

      <div class="preset-group">
        <label>Örnek Fonksiyonlar:</label>
        <div class="preset-buttons">
          <button class="preset-btn" data-expr="x^3 - 3*x">Polinom (3. Derece)</button>
          <button class="preset-btn" data-expr="x^2 - 4">Kök Analizi ($x^2-4$)</button>
          <button class="preset-btn" data-expr="sin(a * x)">Trigonometrik</button>
          <button class="preset-btn" data-expr="exp(-x^2 / 2)">Gaussian</button>
        </div>
      </div>

      <div class="view-controls">
        <button id="reset-view-btn" class="btn btn-secondary">Görünümü Sıfırla (0,0)</button>
      </div>

      <div class="instructions">
        <p>💡 <strong>Gezinme:</strong> Sürükleyerek kaydırın, tekerlekle yakınlaşın.</p>
      </div>
    </aside>

    <!-- Sağ Panel: Canvas -->
    <main class="canvas-container">
      <canvas id="graph-canvas"></canvas>
      <div id="coord-hud" class="coord-hud">x: 0.00, y: 0.00</div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
